<section class="auth-card">
    <p class="eyebrow">Account</p>
    <h1>Register</h1>
    <p class="muted">Create an account to comment on cards and track your collection.</p>

    {{#if Error}}<div class="alert alert-error">{{Error}}</div>{{/if}}

    <form class="stack" method="post" action="/register">
        <label class="field">
            <span>Login</span>
            <input type="text" name="username" value="{{Username}}" minlength="3" maxlength="20" pattern="[a-zA-Z0-9_]{3,20}" required autocomplete="username" autofocus>
            <span class="field-error" hidden>3–20 characters: Latin letters, digits and underscore.</span>
        </label>
        <label class="field">
            <span>Email</span>
            <input type="email" name="email" value="{{Email}}" maxlength="120" required autocomplete="email">
            <span class="field-error" hidden>Please enter a valid email address.</span>
        </label>
        <label class="field">
            <span>Password</span>
            <input type="password" name="password" minlength="6" maxlength="100" required autocomplete="new-password">
            <span class="field-error" hidden>Password must be 6 to 100 characters long.</span>
        </label>
        <label class="field">
            <span>Repeat password</span>
            <input type="password" name="confirmPassword" minlength="6" maxlength="100" required autocomplete="new-password">
            <span class="field-error" hidden>Passwords must match.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
    </form>

    <p class="auth-switch">Already registered? <a href="/login">Log in</a></p>
</section>
