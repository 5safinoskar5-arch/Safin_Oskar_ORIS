<section class="auth-card">
    <p class="eyebrow">Account</p>
    <h1>Log in</h1>
    <p class="muted">Sign in to comment on cards and manage your collection.</p>

    {{#if Error}}<div class="alert alert-error">{{Error}}</div>{{/if}}

    <form class="stack" method="post" action="/login">
        <label class="field">
            <span>Login or email</span>
            <input type="text" name="login" value="{{Login}}" maxlength="120" required autocomplete="username" autofocus>
            <span class="field-error" hidden>Please enter your login or email.</span>
        </label>
        <label class="field">
            <span>Password</span>
            <input type="password" name="password" maxlength="100" required autocomplete="current-password">
            <span class="field-error" hidden>Please enter your password.</span>
        </label>
        <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>

    <p class="auth-switch">No account yet? <a href="/register">Register</a></p>
    <p class="muted auth-hint">Test accounts: admin / Admin123! and player / Player123!</p>
</section>
