            width: 109px;
            height: 108px;

            background: white;
            color: #505050;
            border-radius: 2px;
        }

            margin: 0 0 20px;
            font-size: 24px;
        }
        .field {
            display: block;
            width: 100%;
            height: 50px;
            margin-bottom: 20px;
            padding: 0 19px;
            border: 1px solid #e3e3e3;
            border-radius: 2px;
            background: white;
            color: #222;
            font: 16px Arial, sans-serif;
        }
        .field::placeholder { color: #505050; opacity: 1; }
        .field:focus { outline: 2px solid #ffb210; outline-offset: 1px; }
        .password { position: relative; }
        .password input { padding-right: 48px; }
        .eye {
            position: absolute;
            right: 27px;
            top: 18px;
            width: 16px;
            height: 16px;
            fill: #999;
        }
        .remember {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            color: black;
            font-size: 16px;
        }
        .remember input { width: 20px; height: 20px; margin: 0; accent-color: #ffb210; }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .actions a { color: black; font-size: 16px; }
        .sign-in {
            width: 100px;
            height: 38px;
            border: 1px solid #f5a900;
            border-radius: 3px;
            background: #ffb210;
            color: black;
            font: bold 16px Arial, sans-serif;
            cursor: default;
        }
        .social {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            height: 105px;
            font-size: 18px;
        }
        .services { display: flex; gap: 8px; }
        .services a { display: block; width: 67px; height: 67px; }
        .services img { display: block; width: 67px; height: 67px; }
        .create { margin: 30px 0 0; text-align: center; font-size: 16px; }
        .create a { color: #ffc000; }
        .demo { margin: 14px 0 0; color: #999; text-align: center; font-size: 12px; }
        footer {
            margin-top: auto;
            padding: 60px 20px 20px;
            text-align: center;
            font-size: 12px;
            color: #999;
        }
        footer a { color: #ddd; text-decoration: none; }
