<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search Engine</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            background: #fcfdfd;
            color: #282d34;
            font-family: Arial, sans-serif;
        }

        .weather {
            position: absolute;
            top: 38px;
            right: 48px;
            text-align: right;
        }

        .degrees { font-size: 24px; }

        .city {
            margin-top: 4px;
            font-size: 12px;
            color: #748093;
            text-decoration: underline;
        }

        main {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content {
            width: 520px;
            margin-top: -60px;
            text-align: center;
        }

        .clock {
            margin: 0;
            font-size: 46px;
            font-weight: 600;
        }

        .greeting {
            margin: 14px 0 35px;
            color: #536fa0;
            font-size: 18px;
        }

        .search {
            display: flex;
            align-items: center;
            height: 52px;
            padding: 0 17px;
            border: 1px solid #edf0f2;
            border-radius: 12px;
            background: white;
            box-shadow: 0 4px 18px rgba(30, 55, 75, 0.04);
        }

        .search span {
            margin-right: 11px;
            color: #9ca6af;
            font-size: 21px;
        }

        .search input {
            width: 100%;
            border: 0;
            outline: 0;
            color: #282d34;
            font: 16px Arial, sans-serif;
        }

        .search input::placeholder { color: #aeb7bf; }

        .links {
            display: flex;
            justify-content: center;
            gap: 16px;
            margin-top: 28px;
        }

        .links a {
            width: 42px;
            height: 42px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background: #f5f7f8;
            color: #84909b;
            text-decoration: none;
        }

        .links a:hover { background: #e8eef4; }

        .links svg {
            width: 24px;
            height: 24px;
        }

        .links .add { font-size: 25px; }
    </style>
</head>
<body>
    <div class="weather">
        <div class="degrees">36°</div>
        <div class="city">Weather</div>
    </div>

    <main>
        <div class="content">
            <h1 class="clock">09:11:01</h1>
            <p class="greeting">Good Morning, Saad.</p>

            <form class="search" action="https://www.google.com/search" method="get">
                <span aria-hidden="true">⌕</span>
                <input type="search" name="q" placeholder="Search" aria-label="Search">
            </form>
